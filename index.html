<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HAUL</title>
<meta name="description" content="Plan Facebook Marketplace pickups: capture listings, sort by the minute they were listed, map them and build a timed pickup route.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HAUL">
<meta name="theme-color" content="#17191C">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="lexend.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="overpass.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand" aria-label="HAUL">
      <svg class="brand-sign" viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="7" width="26" height="26" rx="4" transform="rotate(45 20 20)" class="sign-plate"/><rect x="9.5" y="9.5" width="21" height="21" rx="2.6" transform="rotate(45 20 20)" class="sign-rule"/><g transform="translate(20 20.6) scale(.25) translate(-44 -48)"><path d="M42 88 C42 72 60 70 60 56 C60 42 42 40 42 30" class="sign-road"/><path d="M42 8 L28 31 L56 31 Z" class="sign-arrow"/></g></svg>
      <span class="brand-word">HAUL</span>
    </div>
    <div class="top-meta" id="topMeta" aria-live="polite"></div>
    <button class="icon-btn" data-act="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
    </button>
  </header>

  <main class="views">
    <section class="view" id="view-list" aria-label="Listings">
      <div class="list-controls">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <input id="q" type="search" placeholder="Search your listings" autocomplete="off" enterkeyhint="search">
        </label>
        <div class="chip-row" id="sortRow" role="toolbar" aria-label="Sort"></div>
        <div class="chip-row" id="filterRow" role="toolbar" aria-label="Filter"></div>
      </div>
      <div id="listBody"></div>
    </section>

    <section class="view view-map" id="view-map" aria-label="Map" hidden>
      <div id="map"></div>
      <div class="map-banner" id="mapBanner" hidden></div>
      <div class="map-tools">
        <button class="map-btn" data-act="map-locate" aria-label="Show my location"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/><circle cx="12" cy="12" r="7"/></svg></button>
        <button class="map-btn" data-act="map-fit" aria-label="Fit all pins"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="map-btn map-btn-text" data-act="map-toggle-done" id="mapDoneBtn">Active</button>
      </div>
    </section>

    <section class="view" id="view-run" aria-label="Pickup run" hidden></section>
    <section class="view" id="view-hunt" aria-label="Hunts" hidden></section>
  </main>

  <nav class="tabs" aria-label="Sections">
    <button class="tab" data-act="tab" data-tab="list" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="6.5" r="1.6"/><circle cx="5" cy="12" r="1.6"/><circle cx="5" cy="17.5" r="1.6"/><path d="M9.5 6.5h10M9.5 12h10M9.5 17.5h7"/></svg>
      <span>List</span>
    </button>
    <button class="tab" data-act="tab" data-tab="map">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5l5-2 7 2.5 5-2v13l-5 2-7-2.5-5 2z"/><path d="M8.5 4.5v13M15.5 7v13"/></svg>
      <span>Map</span>
    </button>
    <button class="tab tab-add" data-act="add" aria-label="Add a listing">
      <span class="tab-add-plate"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
      <span>Add</span>
    </button>
    <button class="tab" data-act="tab" data-tab="run">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="18.5" r="2"/><path d="M12 19.5c5.5 0 7-3 4-5.5s-8-1-8.5-4.5S10 4.5 15 4.5"/><path d="M18 2.5l2.5 2-2.5 2"/></svg>
      <span>Run</span>
    </button>
    <button class="tab" data-act="tab" data-tab="hunt">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5M10.5 7.5v6M7.5 10.5h6"/></svg>
      <span>Hunt</span>
    </button>
  </nav>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileShot" accept="image/*" hidden>
<input type="file" id="fileImport" accept=".json,.csv,application/json,text/csv,text/plain" hidden>

<script src="leaflet.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
